name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: |
            provider/go.sum
            sdk/go.sum
      - name: Build provider
        run: make build
      - name: Run unit tests and compile the Go SDK
        run: make test
