name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # Build the plugin binaries for every OS/arch and attach them to a GitHub
  # release. The archives follow Pulumi's plugin naming convention, so the
  # schema's pluginDownloadURL (github://api.github.com/adaptive-scale/pulumi-adaptive)
  # resolves them automatically.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Regenerate each language SDK at the release version, build it, and upload
  # it in the layout pulumi-package-publisher expects
  # (an artifact named <lang>-sdk.tar.gz containing <lang>.tar.gz).
  build_sdks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [nodejs, python, dotnet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: actions/setup-node@v4
        if: matrix.language == 'nodejs'
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'dotnet'
        with:
          dotnet-version: 8.0.x
      - name: Install Pulumi CLI (for .NET codegen)
        if: matrix.language == 'dotnet'
        uses: pulumi/actions@v6
      - name: Compute version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Regenerate schema and SDKs at release version
        run: make gen VERSION="$VERSION"
      - name: Regenerate .NET SDK
        if: matrix.language == 'dotnet'
        run: make gen_dotnet
      - name: Build SDK
        run: make build_${{ matrix.language }} VERSION="$VERSION"
      - name: Prune build-only directories
        run: rm -rf sdk/nodejs/node_modules sdk/python/venv
      - name: Tar SDK
        run: tar -zcf sdk/${{ matrix.language }}.tar.gz -C sdk/${{ matrix.language }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.language }}-sdk.tar.gz
          path: sdk/${{ matrix.language }}.tar.gz

  # The Go SDK is consumed straight from the repo; Go modules resolve the
  # sdk/ module through the sdk/vX.Y.Z tag.
  tag_go_sdk:
    runs-on: ubuntu-latest
    needs: [goreleaser]
    steps:
      - uses: actions/checkout@v4
      - name: Tag Go SDK
        run: |
          git tag "sdk/${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git push origin "sdk/${GITHUB_REF_NAME}"
